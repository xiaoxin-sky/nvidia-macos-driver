name: build NMXGPU (UHD 770 audited display batch)
on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore all caches for a clean diagnostic build
        type: boolean
        default: false
      full_audit:
        description: Also compile the full amdgpu compatibility audit set
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'experimental/uhd770/sources.json'
      - 'experimental/uhd770/patches/**'
      - 'experimental/uhd770/tools/**'
      - 'experimental/uhd770/tests/**'
permissions:
  contents: write
concurrency:
  group: nmxgpu-kernel-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      NMX_USE_CACHE: ${{ github.event_name != 'workflow_dispatch' || !inputs.clean_build }}
      NMX_FULL_AUDIT: ${{ github.event_name == 'workflow_dispatch' && inputs.full_audit }}
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out this fork (full history, for the GPU source at 7222618)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostics
        run: |
          set -uo pipefail
          echo "== system =="
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --show-sdk-path
          python3 -V || true
          echo "== kernel link libraries =="
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          ls "$SDK/usr/lib" 2>/dev/null | grep -Ei 'kmod|cc_kext' || echo "not in SDK/usr/lib"
          find "$(xcode-select -p)" -name 'libkmod.a' -o -name 'libcc_kext.a' 2>/dev/null | head -10 || true
          echo "== Kernel.framework headers =="
          ls "$SDK/System/Library/Frameworks/Kernel.framework/Headers" 2>/dev/null | head -5 || true

      - name: Prepare compiler cache and toolchain identity
        id: toolchain
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache
          fi
          {
            sw_vers -productVersion
            xcodebuild -version
            xcrun clang --version
            xcrun --sdk macosx --show-sdk-version
            ccache --version
          } > /tmp/nmx-toolchain.txt
          echo "fingerprint=$(shasum -a 256 /tmp/nmx-toolchain.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$HOME/.cache/nmxgpu/ccache" >> "$GITHUB_ENV"
          echo "NMX_DEPENDENCY_CACHE=$HOME/.cache/nmxgpu/dependencies" >> "$GITHUB_ENV"
          if [[ "$NMX_USE_CACHE" != true ]]; then
            echo 'CCACHE_DISABLE=true' >> "$GITHUB_ENV"
          fi

      - name: Restore pristine pinned dependencies
        id: dependencies
        if: env.NMX_USE_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nmxgpu/dependencies
          key: nmxgpu-deps-v1-${{ runner.os }}-${{ hashFiles('experimental/uhd770/sources.json') }}

      - name: Restore compiler cache
        id: objects
        if: env.NMX_USE_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nmxgpu/ccache
          key: nmxgpu-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nmxgpu-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
            nmxgpu-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-39761550305-1

      - name: Stage the sources
        run: bash experimental/uhd770/tools/stage_sources.sh

      - name: Save pristine pinned dependencies
        if: env.NMX_USE_CACHE == 'true' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nmxgpu/dependencies
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Validate compiler cache invalidation
        run: |
          set -euo pipefail
          bash experimental/uhd770/tools/check_ccache.sh 2>&1 | tee /tmp/nmx-ccache-validation.log
          ccache --set-config=max_size=512M
          ccache --set-config=sloppiness=
          ccache --set-config=depend_mode=false
          ccache --zero-stats

      - name: Build the kernel extension
        run: |
          set -euo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          cd "$X"
          mkdir -p obj obj-i915 obj-xe lkobj srcobj xnuobj lklogs logs logs-i915
          chmod +x ./*.sh
          sed -i '' 's|-I[$]KF|-I$K/freebsd-src/sys -I$KF|' cc.sh cc-i915.sh cclk.sh ccsrc.sh
          echo "== include patch check (want 1 per file) =="
          grep -c 'freebsd-src/sys' cc.sh cc-i915.sh cclk.sh ccsrc.sh || true
          git -C "$X" apply --check "$GITHUB_WORKSPACE/experimental/uhd770/patches/xkpi.patch"
          git -C "$S/kpi/drm-kmod" apply --check "$GITHUB_WORKSPACE/experimental/uhd770/patches/drm-kmod.patch"
          git -C "$S/kpi/freebsd-src" apply --check "$GITHUB_WORKSPACE/experimental/uhd770/patches/freebsd.patch"
          git -C "$X" apply "$GITHUB_WORKSPACE/experimental/uhd770/patches/xkpi.patch"
          git -C "$S/kpi/drm-kmod" apply "$GITHUB_WORKSPACE/experimental/uhd770/patches/drm-kmod.patch"
          git -C "$S/kpi/freebsd-src" apply "$GITHUB_WORKSPACE/experimental/uhd770/patches/freebsd.patch"
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/enable_ccache.py" "$X"
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_drm_node_fixture.py" \
            "$X" /tmp/nmx-drm-node-test.c
          cc -std=c11 -Wall -Wextra -Werror /tmp/nmx-drm-node-test.c -o /tmp/nmx-drm-node-test
          /tmp/nmx-drm-node-test | tee /tmp/nmx-drm-node-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_node_open_fixture.py" \
            --port "$X" --freebsd "$S/kpi/freebsd-src" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/node_open_fixture.c.in" \
            --output /tmp/nmx-node-open-test.c
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter /tmp/nmx-node-open-test.c -o /tmp/nmx-node-open-test
          /tmp/nmx-node-open-test | tee /tmp/nmx-node-open-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_rcu_fixture.py" \
            --port "$X" --freebsd "$S/kpi/freebsd-src" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/rcu_fixture.c.in" \
            --output /tmp/nmx-rcu-fixture
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter -DNMXKPI_XNU=1 \
            -I/tmp/nmx-rcu-fixture/include /tmp/nmx-rcu-fixture/rcu-test.c \
            /tmp/nmx-rcu-fixture/ck_epoch.c -pthread -o /tmp/nmx-rcu-test
          /tmp/nmx-rcu-test | tee /tmp/nmx-rcu-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_sleep_fixture.py" \
            --port "$X" --schedule "$S/kpi/freebsd-src/sys/compat/linuxkpi/common/src/linux_schedule.c" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/sleep_fixture.cpp.in" \
            --output /tmp/nmx-sleep-test.cpp
          c++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -pthread \
            /tmp/nmx-sleep-test.cpp -o /tmp/nmx-sleep-test
          /tmp/nmx-sleep-test | tee /tmp/nmx-sleep-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_ioctl_fixture.py" \
            --port "$X" --drm "$S/kpi/drm-kmod" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/ioctl_fixture.c.in" \
            --output /tmp/nmx-ioctl-test.c
          cc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter \
            /tmp/nmx-ioctl-test.c -o /tmp/nmx-ioctl-test
          /tmp/nmx-ioctl-test | tee /tmp/nmx-ioctl-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_mm_fixture.py" \
            --port "$X" --freebsd "$S/kpi/freebsd-src" \
            --templates "$GITHUB_WORKSPACE/experimental/uhd770/tests" --output /tmp/nmx-mm-fixture
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter -pthread \
            -c /tmp/nmx-mm-fixture/mm-test.c -o /tmp/nmx-mm-test.o
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            /tmp/nmx-mm-fixture/native-mm-test.cpp /tmp/nmx-mm-test.o -o /tmp/nmx-mm-test
          /tmp/nmx-mm-test | tee /tmp/nmx-mm-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_page_map_fixture.py" \
            --port "$X" --templates "$GITHUB_WORKSPACE/experimental/uhd770/tests" \
            --output /tmp/nmx-page-map-test.c
          cc -std=c11 -pthread -Wall -Wextra -Werror -Wno-unused-parameter \
            /tmp/nmx-page-map-test.c -o /tmp/nmx-page-map-test \
            2>&1 | tee /tmp/nmx-page-map-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-page-map-test"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-page-map-test.log
          cc -std=c11 -pthread -g -O1 -fsanitize=address,undefined -Wall -Wextra -Werror \
            -Wno-unused-parameter /tmp/nmx-page-map-test.c -o /tmp/nmx-page-map-asan \
            2>&1 | tee /tmp/nmx-page-map-asan-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-page-map-asan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-page-map-asan.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_ring_fixture.py" \
            --drm "$S/kpi/drm-kmod/drivers/gpu/drm/i915" \
            --templates "$GITHUB_WORKSPACE/experimental/uhd770/tests" \
            --output /tmp/nmx-ring-test.c
          cc -std=c11 -Wall -Wextra -Werror -Wno-pointer-arith -Wno-unused-parameter \
            /tmp/nmx-ring-test.c -o /tmp/nmx-ring-test \
            2>&1 | tee /tmp/nmx-ring-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-ring-test"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-ring-test.log
          cc -std=c11 -g -O1 -fsanitize=address,undefined -Wall -Wextra -Werror \
            -Wno-pointer-arith -Wno-unused-parameter /tmp/nmx-ring-test.c -o /tmp/nmx-ring-asan \
            2>&1 | tee /tmp/nmx-ring-asan-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-ring-asan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-ring-asan.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_thread_fixture.py" \
            --port "$X" --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/thread_lifetime.cpp.in" \
            --output /tmp/nmx-thread-test.cpp
          c++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -pthread \
            /tmp/nmx-thread-test.cpp -o /tmp/nmx-thread-test \
            2>&1 | tee /tmp/nmx-thread-compile.log
          /tmp/nmx-thread-test | tee /tmp/nmx-thread-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_tasklet_fixture.py" \
            --port "$X" --freebsd "$S/kpi/freebsd-src" --drm "$S/kpi/drm-kmod" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/tasklet_fixture.cpp.in" \
            --output /tmp/nmx-tasklet-test.cpp
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function \
            /tmp/nmx-tasklet-test.cpp -o /tmp/nmx-tasklet-test \
            2>&1 | tee /tmp/nmx-tasklet-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-tasklet-test"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-tasklet-test.log
          c++ -std=c++17 -pthread -g -O1 -fsanitize=thread -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-function /tmp/nmx-tasklet-test.cpp -o /tmp/nmx-tasklet-tsan \
            2>&1 | tee /tmp/nmx-tasklet-tsan-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-tasklet-tsan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-tasklet-tsan.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_native_lock_fixture.py" \
            --port "$X" --freebsd "$S/kpi/freebsd-src" --drm "$S/kpi/drm-kmod" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/native_lock_fixture.cpp.in" \
            --output /tmp/nmx-native-lock-test.cpp
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -Wno-unused-parameter \
            -Wno-unused-function -Wno-sign-compare /tmp/nmx-native-lock-test.cpp -o /tmp/nmx-native-lock-test \
            2>&1 | tee /tmp/nmx-native-lock-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-native-lock-test"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-native-lock-test.log
          c++ -std=c++17 -pthread -g -O1 -fsanitize=thread -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare \
            /tmp/nmx-native-lock-test.cpp -o /tmp/nmx-native-lock-tsan \
            2>&1 | tee /tmp/nmx-native-lock-tsan-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-native-lock-tsan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-native-lock-tsan.log
          c++ -std=c++17 -pthread -g -O1 -fsanitize=address,undefined -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare \
            /tmp/nmx-native-lock-test.cpp -o /tmp/nmx-native-lock-asan \
            2>&1 | tee /tmp/nmx-native-lock-asan-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-native-lock-asan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-native-lock-asan.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_kernel_clock_fixture.py" \
            --port "$X" --freebsd "$S/kpi/freebsd-src" --drm "$S/kpi/drm-kmod" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/tests/kernel_clock_fixture.cpp.in" \
            --output /tmp/nmx-kernel-clock-test.cpp
          c++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-function -Wno-unused-variable -Wno-sign-compare \
            /tmp/nmx-kernel-clock-test.cpp -o /tmp/nmx-kernel-clock-test \
            2>&1 | tee /tmp/nmx-kernel-clock-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-kernel-clock-test"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-kernel-clock-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_dma_fixture.py" \
            --port "$X" --drm "$S/kpi/drm-kmod" --templates "$GITHUB_WORKSPACE/experimental/uhd770/tests" \
            --output /tmp/nmx-dma-fixture
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare \
            -c /tmp/nmx-dma-fixture/dma-bus-test.c -o /tmp/nmx-dma-bus-test.o \
            2>&1 | tee /tmp/nmx-dma-c-compile.log
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function \
            /tmp/nmx-dma-fixture/dma-native-test.cpp /tmp/nmx-dma-bus-test.o -o /tmp/nmx-dma-test \
            2>&1 | tee /tmp/nmx-dma-cpp-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-dma-test"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-dma-test.log
          cc -std=c11 -g -O1 -fsanitize=address,undefined -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare -c /tmp/nmx-dma-fixture/dma-bus-test.c \
            -o /tmp/nmx-dma-asan-bus.o 2>&1 | tee /tmp/nmx-dma-asan-c-compile.log
          c++ -std=c++17 -pthread -g -O1 -fsanitize=address,undefined -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-function /tmp/nmx-dma-fixture/dma-native-test.cpp \
            /tmp/nmx-dma-asan-bus.o -o /tmp/nmx-dma-asan 2>&1 | tee /tmp/nmx-dma-asan-cpp-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-dma-asan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-dma-asan.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_completion_fixture.py" \
            --port "$X" --freebsd "$S/kpi/freebsd-src" --drm "$S/kpi/drm-kmod" \
            --templates "$GITHUB_WORKSPACE/experimental/uhd770/tests" \
            --output /tmp/nmx-completion-test.cpp
          c++ -std=c++20 -pthread -Wall -Wextra -Werror -Wno-unused-parameter \
            -Wno-unused-function -Wno-sign-compare /tmp/nmx-completion-test.cpp -o /tmp/nmx-completion-test \
            2>&1 | tee /tmp/nmx-completion-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-completion-test"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-completion-test.log
          c++ -std=c++20 -pthread -g -O1 -fsanitize=thread -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare \
            /tmp/nmx-completion-test.cpp -o /tmp/nmx-completion-tsan \
            2>&1 | tee /tmp/nmx-completion-tsan-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-completion-tsan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-completion-tsan.log
          c++ -std=c++20 -pthread -g -O1 -fsanitize=address,undefined -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare \
            /tmp/nmx-completion-test.cpp -o /tmp/nmx-completion-asan \
            2>&1 | tee /tmp/nmx-completion-asan-compile.log
          python3 -c 'import subprocess; subprocess.run(["/tmp/nmx-completion-asan"], timeout=60, check=True)' \
            2>&1 | tee /tmp/nmx-completion-asan.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_fb_start_fixture.py" \
            "$X/xnu/nmx_fb.cpp" "$GITHUB_WORKSPACE/experimental/uhd770/tests/fb_start_fixture.cpp.in" \
            /tmp/nmx-fb-start-test.cpp
          c++ -std=c++17 -Wall -Wextra -Werror /tmp/nmx-fb-start-test.cpp -o /tmp/nmx-fb-start-test
          /tmp/nmx-fb-start-test | tee /tmp/nmx-fb-start-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_pci_fixture.py" \
            "$X/xnu/nmx_pci.cpp" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/pci_class_fixture.cpp.in" \
            /tmp/nmx-pci-class-test.cpp
          touch /tmp/nmx-instrumented
          test -f /tmp/nmx-instrumented || { echo "::error::instrumentation did not apply"; exit 1; }
          c++ -std=c++17 -Wall -Wextra -Werror /tmp/nmx-pci-class-test.cpp -o /tmp/nmx-pci-class-test
          /tmp/nmx-pci-class-test | tee /tmp/nmx-pci-class-test.log
          touch /tmp/nmx-pci-class-test-ok
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -I"$X/xnu" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/fb_interrupt_fixture.cpp" \
            -o /tmp/nmx-fb-interrupt-test
          /tmp/nmx-fb-interrupt-test | tee /tmp/nmx-fb-interrupt-test.log
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -I"$X/xnu" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/attach_lifecycle_fixture.cpp" \
            -o /tmp/nmx-attach-lifecycle-test
          /tmp/nmx-attach-lifecycle-test | tee /tmp/nmx-attach-lifecycle-test.log
          c++ -std=c++17 -Wall -Wextra -Werror -I"$X/bsdcompat/include/nmxxnu" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/gamma_lut_fixture.cpp" \
            -o /tmp/nmx-gamma-lut-test
          /tmp/nmx-gamma-lut-test | tee /tmp/nmx-gamma-lut-test.log
          c++ -std=c++17 -Wall -Wextra -Werror -I"$X/bsdcompat/include/nmxxnu" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/checked_ranges_fixture.cpp" \
            -o /tmp/nmx-checked-ranges-test
          /tmp/nmx-checked-ranges-test | tee /tmp/nmx-checked-ranges-test.log
          c++ -std=c++17 -Wall -Wextra -Werror -I"$X/bsdcompat/include/nmxxnu" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/display_protocol_fixture.cpp" \
            -o /tmp/nmx-display-protocol-test
          /tmp/nmx-display-protocol-test | tee /tmp/nmx-display-protocol-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_native_display_fixture.py" \
            "$X/xnu/nmx_fb.cpp" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/native_display_fixture.cpp.in" \
            /tmp/nmx-native-display-test.cpp
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I"$X/bsdcompat/include/nmxxnu" -I"$X/xnu" \
            /tmp/nmx-native-display-test.cpp -o /tmp/nmx-native-display-test
          /tmp/nmx-native-display-test | tee /tmp/nmx-native-display-test.log
          python3 "$X/fork_i915_gem_mman.py" "$S/kpi/drm-kmod" /tmp/nmx-i915-mman-generated.c
          cmp "$X/override/i915/i915_gem_mman.c" /tmp/nmx-i915-mman-generated.c
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/acceleration/kernel-tests/prepare_mmap_fixture.py" \
            --port "$X" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/acceleration/kernel-tests/mmap_fixture.c.in" \
            --output /tmp/nmx-i915-mmap-test.c
          cc -std=c11 -Wall -Wextra -Werror /tmp/nmx-i915-mmap-test.c -o /tmp/nmx-i915-mmap-test \
            2>&1 | tee /tmp/nmx-i915-mmap-compile.log
          /tmp/nmx-i915-mmap-test | tee /tmp/nmx-i915-mmap-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/acceleration/workqueue-tests/prepare_fixture.py" \
            --port "$X" \
            --template "$GITHUB_WORKSPACE/experimental/uhd770/acceleration/workqueue-tests/taskqueue_fixture.cpp.in" \
            --output /tmp/nmx-taskqueue-test.cpp
          c++ -std=c++20 -Wall -Wextra -Werror -pthread /tmp/nmx-taskqueue-test.cpp \
            -o /tmp/nmx-taskqueue-test 2>&1 | tee /tmp/nmx-taskqueue-compile.log
          /tmp/nmx-taskqueue-test | tee /tmp/nmx-taskqueue-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_irq_fixture.py" \
            "$X/bsdcompat/src/nmx_bus.c" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/irq_drain_fixture.c.in" \
            /tmp/nmx-irq-drain-test.c
          cc -std=c11 -Wall -Wextra -Werror /tmp/nmx-irq-drain-test.c -o /tmp/nmx-irq-drain-test
          /tmp/nmx-irq-drain-test | tee /tmp/nmx-irq-drain-test.log
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_bridge_fixture.py" \
            "$X/override/src/nmx_fb_bridge.c" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/fb_bridge_fixture.c.in" \
            /tmp/nmx-fb-bridge-test.c
          cc -std=c11 -Wall -Wextra -Werror -I"$X/bsdcompat/include/nmxxnu" \
            /tmp/nmx-fb-bridge-test.c -o /tmp/nmx-fb-bridge-test
          /tmp/nmx-fb-bridge-test | tee /tmp/nmx-fb-bridge-test.log
          touch /tmp/nmx-display-fixtures-ok
          python3 gen_flags.py "$S/kpi/drm-kmod" amd.flags | tee /tmp/genflags.log
          if grep -Eq '^-DCONFIG_PM(_SLEEP|_RUNTIME)?(=|$)' amd.flags; then
            echo "::error::Linux runtime PM is unsupported by the pinned KPI; use i915's always-active branch"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_runtime_pm_fixture.py" \
            "$S/kpi/drm-kmod/drivers/gpu/drm/i915/intel_runtime_pm.c" \
            "$S/kpi/freebsd-src/sys/compat/linuxkpi/common/include/linux/pm_runtime.h" \
            amd.flags /tmp/nmx-runtime-pm-test.c
          cc -std=c11 -Wall -Wextra -Werror /tmp/nmx-runtime-pm-test.c -o /tmp/nmx-runtime-pm-test
          /tmp/nmx-runtime-pm-test | tee /tmp/nmx-runtime-pm-test.log
          if grep -Eq '^-DCONFIG_DRM_(DISPLAY_DP_TUNNEL|I915_DP_TUNNEL)(=|$)' amd.flags; then
            echo "::error::DP tunnel frontend/core flags must both be disabled in this port"
            exit 1
          fi
          echo "DP tunnel configuration verified: frontend=off core=off"
          progress_report() {
            local stage=$1 logdir=$2 objdir=$3 started completed failed latest
            started=$(find "$X/$logdir" -type f -name '*.log' 2>/dev/null | wc -l | tr -d ' ' || true)
            completed=$(find "$X/$objdir" -type f -name '*.o' 2>/dev/null | wc -l | tr -d ' ' || true)
            failed=$(find "$X/$logdir" -type f -name '*.failed' 2>/dev/null | wc -l | tr -d ' ' || true)
            latest=$(find "$X/$logdir" -type f -name '*.log' -exec stat -f '%m %N' {} + 2>/dev/null | sort -nr | head -1 || true)
            echo "::notice title=build progress::$stage logs_started=$started objects_completed=$completed failed=$failed latest=$latest"
          }
          progress_watch() {
            local stage=$1 logdir=$2 objdir=$3
            while :; do
              sleep 30 || return 0
              progress_report "$stage" "$logdir" "$objdir"
            done
          }
          run_build_stage() {
            local stage=$1 logdir=$2 objdir=$3 command=$4 output=$5 watcher
            echo "== $stage start $(date -u '+%Y-%m-%dT%H:%M:%SZ') =="
            progress_watch "$stage" "$logdir" "$objdir" & watcher=$!
            bash -c "$command" | tee "$output" || true
            progress_report "$stage" "$logdir" "$objdir"
            kill "$watcher" 2>/dev/null || true
            wait "$watcher" 2>/dev/null || true
            echo "== $stage end $(date -u '+%Y-%m-%dT%H:%M:%SZ') =="
          }
          if [[ "$NMX_FULL_AUDIT" != true ]]; then
            python3 - <<'PY'
            p = 'all.sh'
            s = open(p).read()
            old = 'amd.flags amd/amdgpu drm ttm dmabuf'
            if old not in s:
                raise SystemExit('fast-path source selector anchor missing')
            s = s.replace(old, 'amd.flags drm ttm dmabuf', 1)
            open('all-fast.sh', 'w').write(s)
            print('UHD770 fast path: amdgpu sources filtered; shared DRM/TTM/dmabuf retained')
            PY
            chmod +x all-fast.sh
            grep -n 'srclist.py' all-fast.sh
            run_build_stage "DRM / TTM / dma-buf (UHD 770 fast path)" logs obj 'bash all-fast.sh 30' /tmp/all.log
          else
            run_build_stage "DRM / TTM / amdgpu" logs obj 'bash all.sh 30' /tmp/all.log
          fi
          run_build_stage "i915" logs-i915 obj-i915 'bash all-i915.sh 30' /tmp/i915.log
          echo "== LinuxKPI runtime + bsdcompat + IOKit glue start $(date -u '+%Y-%m-%dT%H:%M:%SZ') =="
          bash rt.sh | tee /tmp/rt.log || true
          echo "== LinuxKPI runtime + bsdcompat + IOKit glue end $(date -u '+%Y-%m-%dT%H:%M:%SZ') =="
          echo "== link (xe left out: UHD 770 is i915 only) start $(date -u '+%Y-%m-%dT%H:%M:%SZ') =="
          python3 - <<'PY'
          p = 'kext/build.sh'
          s = open(p).read()
          s = s.replace('xcrun ld -r -arch x86_64 obj-xe/*.o -exported_symbols_list xe.exp -o xe_all.o', 'true  # xe sources are not built in this job')
          s = s.replace('obj-i915/*.o xe_all.o lkobj', 'obj-i915/*.o lkobj')
          s = s.replace('-lkmodc++ -lkmod -lcc_kext', '-L"$(xcrun --sdk macosx --show-sdk-path)/usr/lib" -lkmodc++ -lkmod -lcc_kext')
          open(p, 'w').write(s)
          print('patched kext/build.sh')
          PY
          grep -n 'obj-i915\|xcrun --sdk' kext/build.sh
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          bash kext/build.sh "$GITHUB_WORKSPACE/out" 2>&1 | tee /tmp/link.log || true
          echo "== link (xe left out: UHD 770 is i915 only) end $(date -u '+%Y-%m-%dT%H:%M:%SZ') =="
          echo "== summary =="
          grep -E 'sources:|runtime sources:' /tmp/all.log /tmp/i915.log /tmp/rt.log || true
          tail -30 /tmp/link.log || true

      - name: Save compiler cache after a complete successful build
        if: success() && env.NMX_USE_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nmxgpu/ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}

      - name: Record compiler cache statistics
        if: always() && steps.toolchain.outcome == 'success'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          ccache --show-stats | tee "$GITHUB_WORKSPACE/out/logs/ccache-statistics.txt"
          ccache --print-stats > "$GITHUB_WORKSPACE/out/logs/ccache-statistics.tsv"
          ccache --show-config > "$GITHUB_WORKSPACE/out/logs/ccache-config.txt"
          cat "$GITHUB_WORKSPACE/out/logs/ccache-statistics.txt" >> "$GITHUB_STEP_SUMMARY"

      # Every build step above is deliberately tolerant so that all the logs get collected.
      # Without this gate a dropped translation unit disappears silently: the sources that
      # fail are the only ones that reference ACPI, so the kext still links with no ACPI at
      # all. This step turns that into a red run.
      - name: Fail if any source was dropped
        if: always()
        run: |
          set -uo pipefail
          total=0
          detail=""
          for f in /tmp/all.log /tmp/i915.log /tmp/rt.log; do
            n=$(sed -n 's/.*failed: *\([0-9][0-9]*\).*/\1/p' "$f" 2>/dev/null | head -1 || true)
            if [ -z "${n:-}" ]; then
              echo "::error::$f is missing or has no summary line"
              exit 1
            fi
            echo "$(basename "$f"): $n failed"
            detail="$detail $(basename "$f" .log)=$n"
            total=$((total + n))
          done
          ksize=$(stat -f %z "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" 2>/dev/null || echo 0)
          sha=$(git -C /Volumes/MiniData/build/gpu-src/kpi/freebsd-src rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "::notice title=NMXGPU build result::failed=$total$detail freebsd-src=$sha kext=${ksize}B"
          echo "total failed sources: $total"
          if [ "$total" -ne 0 ]; then
            echo "::error::$total source(s) failed to compile; see ci/last-run.txt and the nmxgpu-build artifact"
            exit 1
          fi
          test -x "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" \
            || { echo "::error::NMXGPU was not linked; see ci/last-run.txt"; exit 1; }
          test -f /tmp/nmx-instrumented \
            || { echo "::error::diagnostic instrumentation did not complete"; exit 1; }
          BIN="$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU"
          xcrun nm -arch x86_64 "$BIN" > /tmp/nmxgpu-symbols.txt \
            || { echo "::error::cannot read NMXGPU symbols"; exit 1; }
          for sym in _i915_pci_driver _i915_driver_probe _adl_s_info _nmx_port_attach _nmx_gpu_stage_record _nmx_xnu_pci_find_class _nmx_i915_scanout_map _nmx_i915_scanout_unmap _nmx_intel_fb_pin_mappable _nmx_fb_gamma _nmx_drm_gamma_set _nmx_fb_display_state _nmx_fb_set_mode _nmx_fb_reprobe; do
            grep -Eq "[[:space:]][TtDdSsBbRr][[:space:]]$sym$" /tmp/nmxgpu-symbols.txt \
              || { echo "::error::missing defined symbol $sym (undefined imports do not count)"; exit 1; }
          done
          strings -a "$BIN" > /tmp/nmxgpu-strings.txt \
            || { echo "::error::cannot read NMXGPU diagnostic strings"; exit 1; }
          for marker in 'stage display_noirq' 'stage irq_install' 'stage gem_init' 'stage display_probe' 'optional opregion_setup' 'ASLS_present=' 'tunnel_config i915=' 'nogem tunnel_mgr_init' 'memstage-v2' 'framebuffer.before' 'gem_init.before' 'pm.callback.before' 'fb.commit.before' 'attach.complete' 'NullMoth PCI enum v1' 'pch_detect type=' 'hpd_tables pch=' 'pch_hpd missing' 'igtt.pin.before' 'igtt.iomap.after' 'boot guard retained for recovery' 'ADL-S CPU scanout, FBC disabled' 'failed: port attach; guard retained'; do
            grep -Fq "$marker" /tmp/nmxgpu-strings.txt \
              || { echo "::error::missing diagnostic marker $marker"; exit 1; }
          done
          test -f /tmp/nmx-pci-class-test-ok || { echo "::error::PCI class iterator fixture did not pass"; exit 1; }
          test -f /tmp/nmx-display-fixtures-ok || { echo "::error::display lifecycle/fault fixtures did not pass"; exit 1; }
          echo "NMXGPU diagnostic symbols and stage markers verified"
          grep -Eq '[[:space:]][Tt][[:space:]]_nmx_fb_activate$' /tmp/nmxgpu-symbols.txt \
            || { echo "::error::native display handoff entry missing"; exit 1; }
          for marker in 'fb.commit.deferred' 'native enableController' 'nmxdiag-attach-complete'; do
            grep -Fq "$marker" /tmp/nmxgpu-strings.txt || { echo "::error::native handoff marker missing: $marker"; exit 1; }
          done

      - name: Preflight native kernel collection without loading the driver
        if: success()
        run: |
          bash experimental/uhd770/tools/check_kernel_collection.sh \
            "$GITHUB_WORKSPACE/out/NMXGPU.kext" "$GITHUB_WORKSPACE/out/logs"

      - name: Collect logs and the kext
        if: always()
        run: |
          set -uo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          cp /tmp/all.log /tmp/i915.log /tmp/rt.log /tmp/link.log /tmp/genflags.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-drm-node-test.c /tmp/nmx-drm-node-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-node-open-test.c /tmp/nmx-node-open-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-rcu-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-rcu-fixture/rcu-test.c "$GITHUB_WORKSPACE/out/logs/nmx-rcu-test.c" 2>/dev/null || true
          cp /tmp/nmx-sleep-test.cpp /tmp/nmx-sleep-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-ioctl-test.c /tmp/nmx-ioctl-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-mm-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-mm-fixture/mm-test.c "$GITHUB_WORKSPACE/out/logs/nmx-mm-test.c" 2>/dev/null || true
          cp /tmp/nmx-mm-fixture/native-mm-test.cpp "$GITHUB_WORKSPACE/out/logs/nmx-native-mm-test.cpp" 2>/dev/null || true
          cp /tmp/nmx-page-map-test.c /tmp/nmx-page-map*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-ring-test.c /tmp/nmx-ring*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-thread-test.cpp /tmp/nmx-thread-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-thread-compile.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-tasklet-test.cpp /tmp/nmx-tasklet*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-native-lock-test.cpp /tmp/nmx-native-lock*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-kernel-clock-test.cpp /tmp/nmx-kernel-clock*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-dma*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-dma-fixture/dma-bus-test.c /tmp/nmx-dma-fixture/dma-native-test.cpp "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-completion-test.cpp /tmp/nmx-completion*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/experimental/uhd770/patches/freebsd.patch" "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-fb-start-test.cpp /tmp/nmx-fb-start-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-runtime-pm-test.c /tmp/nmx-runtime-pm-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp "$X/amd.flags" "$GITHUB_WORKSPACE/out/logs/amd.flags" 2>/dev/null || true
          for d in logs logs-i915 lklogs; do
            [ -d "$X/$d" ] && cp -R "$X/$d" "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          done
          cp "$X"/xlog_nmx_kext.txt "$X"/link.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          for f in "$X"/srclog_*.txt "$X"/xlog_*.txt; do
            [ -f "$f" ] || continue
            cp "$f" "$GITHUB_WORKSPACE/out/logs/"
          done
          mkdir -p "$GITHUB_WORKSPACE/out/logs/diagnostic-source"
          cp "$X/xnu/nmx_kext.cpp" "$X/xnu/nmx_fb.cpp" "$X/override/src/nmx_fb_bridge.c" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/xnu/nmx_pci.cpp" "$X/bsdcompat/src/nmx_bus.c" "$X/bsdcompat/include/nmx_xnu.h" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/override/src/nmx_drm_os.c" "$X/bsdcompat/include/nmx_drm_uapi.h" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_ddi.c" "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_hotplug_irq.c" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp /tmp/nmx-pci-class-test.cpp /tmp/nmx-pci-class-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-fb-interrupt-test.log /tmp/nmx-fb-bridge-test.c /tmp/nmx-fb-bridge-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-attach-lifecycle-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-gamma-lut-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-checked-ranges-test.log /tmp/nmx-irq-drain-test.c /tmp/nmx-irq-drain-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-display-protocol-test.log "$X/bsdcompat/include/nmx_display_protocol.h" "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-native-display-test.cpp /tmp/nmx-native-display-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-i915-mmap-test.c /tmp/nmx-i915-mmap-test.log /tmp/nmx-i915-mmap-compile.log /tmp/nmx-i915-mman-generated.c "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-taskqueue-test.cpp /tmp/nmx-taskqueue-test.log /tmp/nmx-taskqueue-compile.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp "$X/bsdcompat/src/nmx_task.c" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/xnu/nmx_fb_interrupts.h" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/xnu/nmx_attach_lifecycle.h" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/bsdcompat/include/nmx_gamma_lut.h" "$S/kpi/drm-kmod/drivers/gpu/drm/drm_color_mgmt.c" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/bsdcompat/include/nmx_checked_ranges.h" "$X/bsdcompat/src/nmx_busdma.c" "$X/xnu/nmx_dma.cpp" "$X/xnu/nmx_vm.cpp" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp /tmp/nmx-ccache-validation.log /tmp/nmx-toolchain.txt "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp "$X/cc.sh" "$X/cc-i915.sh" "$X/cclk.sh" "$X/ccsrc.sh" "$X/ccxx.sh" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/override/i915/nmx_i915_scanout.c" "$X/bsdcompat/include/nmx_port.h" "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_fb_pin.c" "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_fb_pin.h" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_display_driver.c" "$GITHUB_WORKSPACE/experimental/uhd770/sources.json" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out" || true

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmxgpu-build
          path: out
          if-no-files-found: warn

      - name: Publish the log back into this repo
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          mkdir -p ci
          {
            echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "commit $GITHUB_SHA"
            echo "freebsd-src $(git -C "$S/kpi/freebsd-src" rev-parse HEAD 2>/dev/null || echo unknown)"
            echo
            for f in /tmp/genflags.log /tmp/all.log /tmp/i915.log /tmp/rt.log /tmp/link.log "$GITHUB_WORKSPACE/out/logs/ccache-statistics.txt"; do
              if [ -f "$f" ]; then
                echo "===== $f"
                tail -100 "$f"
                echo
              fi
            done
            echo "===== first failing sources"
            for d in logs logs-i915 lklogs; do
              [ -d "$X/$d" ] || continue
              while IFS= read -r l; do
                echo "--- $l"
                grep -m20 'error:' "$l" 2>/dev/null || true
              done < <(grep -l 'error:' "$X/$d"/*.log 2>/dev/null | head -12 || true)
            done
            for l in "$X"/srclog_*.txt "$X"/xlog_*.txt; do
              [ -f "$l" ] || continue
              if grep -q 'error:' "$l"; then
                echo "--- $l"
                grep -m20 'error:' "$l" || true
              fi
            done
            echo "===== kext"
            ls -l "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" 2>/dev/null || echo "no NMXGPU binary"
          } > ci/last-run.txt
          # The same text on the run page, so the numbers survive a failed push.
          { echo '```'; cat ci/last-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci/last-run.txt
          if git diff --cached --quiet; then
            echo "no log change"
            exit 0
          fi
          git commit -m "ci: build log $GITHUB_RUN_ID"
          for i in 1 2 3; do
            if out=$(git push origin HEAD:main 2>&1); then
              echo "pushed the log"
              exit 0
            fi
            echo "::warning title=log push $i failed::$out"
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            sleep 5
          done
          echo "::warning title=log not published::the build log stays in ci/last-run.txt on the runner and in the nmxgpu-build artifact"
