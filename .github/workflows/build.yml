name: build NMXGPU (UHD 770 live stage v2)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - name: Check out this fork (full history, for the GPU source at 7222618)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostics
        run: |
          set -uo pipefail
          echo "== system =="
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --show-sdk-path
          python3 -V || true
          echo "== kernel link libraries =="
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          ls "$SDK/usr/lib" 2>/dev/null | grep -Ei 'kmod|cc_kext' || echo "not in SDK/usr/lib"
          find "$(xcode-select -p)" -name 'libkmod.a' -o -name 'libcc_kext.a' 2>/dev/null | head -10 || true
          echo "== Kernel.framework headers =="
          ls "$SDK/System/Library/Frameworks/Kernel.framework/Headers" 2>/dev/null | head -5 || true

      - name: Stage the sources
        run: |
          set -euo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          sudo mkdir -p "$S" /opt/homebrew/bin
          sudo chown -R "$(id -u):$(id -g)" /Volumes/MiniData
          sudo ln -sf "$(command -v python3)" /opt/homebrew/bin/python3
          rm -rf "$X" "$S/kpi"
          mkdir -p "$S/kpi"
          echo "== NMX GPU source at 7222618 =="
          rm -rf /tmp/nmx-src && mkdir -p /tmp/nmx-src
          git archive 7222618727449426631d13d0654f8347634717e9 gpu-port/xkpi | tar -x -C /tmp/nmx-src
          cp -R /tmp/nmx-src/gpu-port/xkpi "$X"
          chmod +x "$X"/*.sh
          echo "== drm-kmod at c16de0f9 =="
          curl -fsSL -o /tmp/drm.tgz https://codeload.github.com/freebsd/drm-kmod/tar.gz/c16de0f9fa84f70b9551f69fde837a7f3a73c0e9
          tar -xzf /tmp/drm.tgz -C "$S/kpi"
          mv "$S/kpi"/drm-kmod-c16de0f9fa84f70b9551f69fde837a7f3a73c0e9 "$S/kpi/drm-kmod"
          echo "== the port's linux_pci.c against today's linux/pci.h =="
          python3 - "$X" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1], 'override/src/linux_pci.c')
          s = p.read_text()
          anchor = '#include "pcib_if.h"\n'
          shim = '''
          #include <linux/list.h>
          #include <linux/spinlock.h>

          /* freebsd-src 2026 made these static inside linux_pci.c (and renamed them to
           * lkpi_pci_*) after this file was forked. The fork replaces that translation
           * unit and override/src/linux_compat.c still defines all three, so declare them. */
          extern struct list_head pci_drivers;
          extern struct list_head pci_devices;
          extern spinlock_t pci_lock;
          '''
          assert s.count(anchor) == 1, s.count(anchor)
          if 'extern spinlock_t pci_lock;' not in s:
              p.write_text(s.replace(anchor, anchor + shim, 1))
              print('linux_pci.c: declared pci_drivers/pci_devices/pci_lock')
          PY
          grep -n 'extern spinlock_t pci_lock' "$X/override/src/linux_pci.c"
          echo "== FreeBSD LinuxKPI + CK + ACPICA (pinned) =="
          FBSD_SHA=7668705cb9837d4c3a6db9b3434b3a522220c8ea
          git init -q "$S/kpi/freebsd-src"
          cd "$S/kpi/freebsd-src"
          git remote add origin https://github.com/freebsd/freebsd-src
          git fetch -q --depth 1 --filter=blob:none origin "$FBSD_SHA"
          git sparse-checkout init --cone
          git sparse-checkout set sys/compat/linuxkpi sys/contrib/ck sys/contrib/dev/acpica
          git checkout -q FETCH_HEAD
          echo "freebsd-src $(git rev-parse HEAD)"
          test -f sys/contrib/dev/acpica/include/acpi.h
          du -sh "$S/kpi/drm-kmod" "$S/kpi/freebsd-src" "$X"

      - name: Build the kernel extension
        run: |
          set -euo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          cd "$X"
          mkdir -p obj obj-i915 obj-xe lkobj srcobj xnuobj lklogs logs logs-i915
          chmod +x ./*.sh
          sed -i '' 's|-I[$]KF|-I$K/freebsd-src/sys -I$KF|' cc.sh cc-i915.sh cclk.sh ccsrc.sh
          echo "== include patch check (want 1 per file) =="
          grep -c 'freebsd-src/sys' cc.sh cc-i915.sh cclk.sh ccsrc.sh || true
          python3 - <<'PY'
          def ins(path, needle, text, scope=None):
              """Insert a diagnostic after one complete C statement, including multiline calls.
          
              The needle must match exactly one line in the pinned source or named function.
              A scope ends at the column-zero closing brace used by these FreeBSD sources.
              Never insert between call arguments; reject a missing statement end.
              """
              lines = open(path).read().split('\n')
              start, stop = 0, len(lines)
              if scope is not None:
                  functions = [i for i, line in enumerate(lines) if scope in line]
                  assert len(functions) == 1, (path, scope, len(functions))
                  start = functions[0]
                  stop = next((i for i in range(start + 1, len(lines)) if lines[i] == '}'), len(lines))
                  assert stop < len(lines), (path, scope, 'no function end')
              hits = [i for i in range(start, stop) if needle in lines[i]]
              assert len(hits) == 1, (path, needle, len(hits))
              end = hits[0]
              while not lines[end].rstrip().endswith(';'):
                  end += 1
                  assert end < stop and end - hits[0] < 8, (path, needle, 'no statement end')
              lines.insert(end + 1, text)
              open(path, 'w').write('\n'.join(lines))
          X = '/Volumes/MiniData/build/gpu-src/xkpi'
          D = '/Volumes/MiniData/build/gpu-src/kpi/drm-kmod/drivers/gpu/drm/i915'
          # The port omits the generic DP tunnel helper. Disable its i915 frontend too:
          # otherwise drm_dp_tunnel_mgr_create() is the -EOPNOTSUPP header stub.
          flags_path = X + '/gen_flags.py'
          flags_source = open(flags_path).read()
          tunnel_anchor = '"DRM_DISPLAY_DP_TUNNEL",'
          assert flags_source.count(tunnel_anchor) == 1
          assert '"DRM_I915_DP_TUNNEL"' not in flags_source
          flags_source = flags_source.replace(tunnel_anchor, tunnel_anchor + ' "DRM_I915_DP_TUNNEL",', 1)
          open(flags_path, 'w').write(flags_source)
          print('Disabled both DRM_DISPLAY_DP_TUNNEL and DRM_I915_DP_TUNNEL')
          p = X + '/bsdcompat/src/nmx_bus.c'
          s = open(p).read()
          a = '    int r = probe ? probe(dev) : 0;'
          assert s.count(a) == 1
          s = s.replace(a, a + '\n    printf("NullMoth dbg: probe_with %s -> %d\\n", driver->name, r);', 1)
          a = '        TAILQ_FOREACH(dl, &dc->drivers, link) {'
          assert s.count(a) == 1
          s = s.replace(a, a + '\n            printf("NullMoth dbg: add_device %s offering %s\\n", device_get_nameunit(dev), dl->driver->name);', 1)
          open(p, 'w').write(s)
          p = X + '/override/src/linux_pci.c'
          attach_scope = 'linux_pci_attach_device(device_t dev, struct pci_driver *pdrv,'
          ins(p, 'error = lkpifill_pci_dev(dev, pdev);', '\tprintf("NullMoth dbg: fill -> %d\\n", error);', scope=attach_scope)
          ins(p, 'error = linux_pdev_dma_init(pdev);', '\tprintf("NullMoth dbg: dma_init -> %d\\n", error);', scope=attach_scope)
          ins(p, 'error = pdrv->probe(pdev, id);', '\t\tprintf("NullMoth dbg: pdrv %s probe -> %d\\n", pdrv->name, error);', scope=attach_scope)
          d = D + '/i915_driver.c'
          ins(d, 'ret = pci_enable_device(pdev);', '\tpr_info("NullMoth dbg: stage pci_enable -> %d\\n", ret);')
          ins(d, 'ret = i915_driver_early_probe(i915);', '\tpr_info("NullMoth dbg: stage early_probe -> %d\\n", ret);')
          ins(d, 'ret = intel_gt_probe_all(i915);', '\tpr_info("NullMoth dbg: stage gt_probe -> %d\\n", ret);')
          ins(d, 'ret = i915_driver_mmio_probe(i915);', '\tpr_info("NullMoth dbg: stage mmio_probe -> %d\\n", ret);')
          ins(d, 'ret = i915_driver_hw_probe(i915);', '\tpr_info("NullMoth dbg: stage hw_probe -> %d\\n", ret);')
          ins(d, 'ret = intel_display_driver_probe_noirq(display);', '\tpr_info("NullMoth dbg: stage display_noirq -> %d\\n", ret);')
          ins(d, 'ret = intel_irq_install(i915);', '\tpr_info("NullMoth dbg: stage irq_install -> %d\\n", ret);')
          ins(d, 'ret = intel_display_driver_probe_nogem(display);', '\tpr_info("NullMoth dbg: stage display_nogem -> %d\\n", ret);')
          ins(d, 'ret = i915_gem_init(i915);', '\tpr_info("NullMoth dbg: stage gem_init -> %d\\n", ret);')
          ins(d, 'ret = intel_pxp_init(i915);', '\tpr_info("NullMoth dbg: optional pxp_init -> %d (may be ignored by upstream)\\n", ret);')
          ins(d, 'ret = intel_display_driver_probe(display);', '\tpr_info("NullMoth dbg: stage display_probe -> %d\\n", ret);')
          # Keep OpRegion's upstream semantics: report its result without propagating it.
          s = open(d).read()
          anchor = '\tintel_opregion_setup(display);'
          assert s.count(anchor) == 1, (d, anchor, s.count(anchor))
          replacement = '\t{\n\t\tint nmx_opregion_ret = intel_opregion_setup(display);\n\t\tpr_info("NullMoth dbg: optional opregion_setup -> %d (ignored by upstream)\\n", nmx_opregion_ret);\n\t}'
          open(d, 'w').write(s.replace(anchor, replacement, 1))
          op = D + '/display/intel_opregion.c'
          ins(op, 'pci_read_config_dword(pdev, ASLS, &asls);', '\tpr_info("NullMoth dbg: opregion ASLS_present=%d\\n", asls != 0);')
          dd = D + '/display/intel_display_driver.c'
          ins(dd, 'ret = intel_vga_register(display);', '\tpr_info("NullMoth dbg: disp vga_register -> %d\\n", ret);')
          ins(dd, 'ret = intel_power_domains_init(display);', '\tpr_info("NullMoth dbg: disp power_domains_init -> %d\\n", ret);')
          ins(dd, 'ret = intel_cdclk_init(display);', '\tpr_info("NullMoth dbg: disp cdclk_init -> %d\\n", ret);')
          ins(dd, 'ret = intel_color_init(display);', '\tpr_info("NullMoth dbg: disp color_init -> %d\\n", ret);')
          ins(dd, 'ret = intel_dbuf_init(i915);', '\tpr_info("NullMoth dbg: disp dbuf_init -> %d\\n", ret);')
          ins(dd, 'ret = intel_bw_init(i915);', '\tpr_info("NullMoth dbg: disp bw_init -> %d\\n", ret);')
          ins(dd, 'ret = intel_pmdemand_init(display);', '\tpr_info("NullMoth dbg: disp pmdemand_init -> %d\\n", ret);')
          nogem_scope = 'int intel_display_driver_probe_nogem('
          ins(dd, 'int ret;', '\tpr_info("NullMoth dbg: tunnel_config i915=%d core=%d\\n", IS_ENABLED(CONFIG_DRM_I915_DP_TUNNEL), IS_ENABLED(CONFIG_DRM_DISPLAY_DP_TUNNEL));', scope=nogem_scope)
          ins(dd, 'ret = intel_crtc_init(i915, pipe);', '\t\tpr_info("NullMoth dbg: nogem crtc pipe %d -> %d\\n", pipe, ret);', scope=nogem_scope)
          ins(dd, 'ret = intel_dp_tunnel_mgr_init(display);', '\tpr_info("NullMoth dbg: nogem tunnel_mgr_init -> %d\\n", ret);', scope=nogem_scope)
          ir = D + '/i915_irq.c'
          ins(ir, 'ret = request_irq(irq, intel_irq_handler(dev_priv),', '\tpr_info("NullMoth dbg: request_irq(%d) -> %d\\n", irq, ret);')
          def ins_before(path, needle, text):
              """Insert a checkpoint before one unique single-line call in the pinned source."""
              rows = open(path).read().split("\n")
              hits = [i for i, row in enumerate(rows) if needle in row]
              assert len(hits) == 1, (path, needle, len(hits))
              rows.insert(hits[0], text)
              open(path, "w").write("\n".join(rows))
          cpp = X + "/xnu/nmx_kext.cpp"
          source = open(cpp).read()
          anchor = "#include <libkern/c++/OSData.h>\n"
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + "#include <libkern/libkern.h>\n", 1)
          anchor = "\nvoid NMXGPU::attachNow()\n"
          assert source.count(anchor) == 1
          stage_helper = '/* Diagnostic build for one UHD 770: publish stages in RAM and IOLog only.\n * No checkpoint calls NVRAM or sync. The original attach guard stays unchanged.\n * g_lock protects the owner and sequence; it is released before property/log I/O.\n * The attach thread/IOKit owns the service, and stop clears the borrowed owner.\n */\nstatic IOService *g_nmx_stage_owner;\nstatic unsigned g_nmx_stage_sequence;\n\nstatic void nmx_diag_set_owner(IOService *owner)\n{\n    IOLockLock(g_lock);\n    g_nmx_stage_owner = owner;\n    IOLockUnlock(g_lock);\n}\n\nextern "C" void nmx_gpu_stage_record(const char *stage, int result)\n{\n    if (stage == nullptr || g_lock == nullptr)\n        return;\n    IOLockLock(g_lock);\n    unsigned sequence = ++g_nmx_stage_sequence;\n    IOService *owner = g_nmx_stage_owner;\n    if (owner != nullptr)\n        owner->retain();\n    IOLockUnlock(g_lock);\n    char value[160];\n    snprintf(value, sizeof(value), "memstage-v2 seq=%u %s ret=%d", sequence, stage, result);\n    if (owner != nullptr) {\n        owner->setProperty("nmxdiag-stage", value);\n        owner->release();\n    }\n    IOLog("NullMoth trace: %s\\n", value);\n}\n'
          source = source.replace(anchor, "\n" + stage_helper + anchor, 1)
          open(cpp, "w").write(source)
          ins_before(cpp, "dev_ = nmx_port_attach(pci_);", '    nmx_gpu_stage_record("port.before", 0);')
          ins(cpp, "dev_ = nmx_port_attach(pci_);", '    nmx_gpu_stage_record("port.after", dev_ != nullptr ? 0 : -1);')
          ins_before(cpp, "    PMinit();", '    nmx_gpu_stage_record("publish.before", 0);')
          ins(cpp, "    pci_->registerService();", '    nmx_gpu_stage_record("publish.after", 0);')
          ins_before(cpp, "fb_ = nmx_fb_publish(this, dev_);", '    nmx_gpu_stage_record("framebuffer.before", 0);')
          ins(cpp, "fb_ = nmx_fb_publish(this, dev_);", '    nmx_gpu_stage_record("framebuffer.after", fb_ != nullptr ? 0 : -1);')
          driver = D + "/i915_driver.c"
          source = open(driver).read()
          anchor = '#include "i915_drv.h"\n'
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + "extern void nmx_gpu_stage_record(const char *, int);\n", 1)
          open(driver, "w").write(source)
          for function, label in [("intel_display_driver_probe_noirq", "display_noirq"), ("intel_irq_install", "irq_install"), ("intel_display_driver_probe_nogem", "display_nogem"), ("i915_gem_init", "gem_init"), ("intel_display_driver_probe", "display_probe")]:
              arg = "display" if function.startswith("intel_display_driver_") else "i915"
              call = "ret = " + function + "(" + arg + ");"
              ins_before(driver, call, '\tnmx_gpu_stage_record("' + label + '.before", 0);')
              ins(driver, call, '\tnmx_gpu_stage_record("' + label + '.after", ret);')
          # The original boot guard remains authoritative. Let launchd/logd and the
          # bounded userspace recorder start before touching display hardware.
          source = open(cpp).read()
          anchor = "void NMXGPU::attachNow()\n{\n"
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + '    nmx_diag_set_owner(this);\n    setProperty("nmxdiag-build", "memstage-v2-20261019");\n    nmx_gpu_stage_record("firmware.wait.before", 0);\n', 1)
          anchor = "void NMXGPU::stop(IOService *provider)\n{\n"
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + '    nmx_diag_set_owner(nullptr);\n', 1)
          open(cpp, "w").write(source)
          ins(cpp, "int err = nmx_xnu_wait_firmware_root(300);", '    nmx_gpu_stage_record("firmware.wait.after", err);')
          delay = '    /* Diagnostic-only delay, not a display/initialization fix. */\n    int nmx_diag_delay = 90;\n    PE_parse_boot_argn("nmxdiagdelay", &nmx_diag_delay, sizeof(nmx_diag_delay));\n    if (nmx_diag_delay < 30 || nmx_diag_delay > 300)\n        nmx_diag_delay = 90;\n    nmx_gpu_stage_record("delay.before", nmx_diag_delay);\n    IOSleep(static_cast<unsigned>(nmx_diag_delay) * 1000U);\n    nmx_gpu_stage_record("delay.after", 0);\n    nmx_gpu_stage_record("guard.set.before", 0);'
          ins_before(cpp, "    nmx_marker_write(true);", delay)
          ins(cpp, "    nmx_marker_write(true);", '    nmx_gpu_stage_record("guard.set.after", 0);')
          source = open(cpp).read()
          for old, new in [('    registerPowerDriver(this, states, 2);', '    IOReturn nmx_pm_ret = registerPowerDriver(this, states, 2);'), ('    pci_->setProperty("nmxgpu-claimed", kOSBooleanTrue);', '    bool nmx_claim_set = pci_->setProperty("nmxgpu-claimed", kOSBooleanTrue);')]:
              assert source.count(old) == 1
              source = source.replace(old, new, 1)
          open(cpp, "w").write(source)
          for call, label in [("    PMinit();", "pm.init"), ("    pci_->joinPMtree(this);", "pm.join"), ("    registerService();", "service.self"), ("    pci_->registerService();", "service.pci")]:
              ins_before(cpp, call, '    nmx_gpu_stage_record("' + label + '.before", 0);')
              ins(cpp, call, '    nmx_gpu_stage_record("' + label + '.after", 0);')
          ins_before(cpp, '    IOReturn nmx_pm_ret = registerPowerDriver(this, states, 2);', '    nmx_gpu_stage_record("pm.register.before", 0);')
          ins(cpp, '    IOReturn nmx_pm_ret = registerPowerDriver(this, states, 2);', '    nmx_gpu_stage_record("pm.register.after", static_cast<int>(nmx_pm_ret));')
          ins_before(cpp, '    bool nmx_claim_set = pci_->setProperty("nmxgpu-claimed", kOSBooleanTrue);', '    nmx_gpu_stage_record("claim.before", 0);')
          ins(cpp, '    bool nmx_claim_set = pci_->setProperty("nmxgpu-claimed", kOSBooleanTrue);', '    nmx_gpu_stage_record("claim.after", nmx_claim_set ? 0 : -1);')
          ins(cpp, "    attach_ = 1;", '    nmx_gpu_stage_record("attach.complete", fb_ != nullptr ? 0 : -1);')
          power_scope = "IOReturn NMXGPU::setPowerState("
          ins_before(cpp, "        int err = nmx_port_power(dev_, state != 0);", '        nmx_gpu_stage_record("pm.callback.before", static_cast<int>(state));')
          ins(cpp, "        int err = nmx_port_power(dev_, state != 0);", '        nmx_gpu_stage_record("pm.callback.after", err);', scope=power_scope)

          # Observe the actual display bridge as well: successful port attach does not
          # imply that probing connectors, mapping a scan-out, or committing a mode works.
          fb = X + "/xnu/nmx_fb.cpp"
          bridge = X + "/override/src/nmx_fb_bridge.c"
          for path, declaration in [(fb, 'extern "C" void nmx_gpu_stage_record(const char *, int);'), (bridge, 'extern void nmx_gpu_stage_record(const char *, int);')]:
              source = open(path).read()
              anchor = '#include "nmx_port.h"\n'
              assert source.count(anchor) == 1
              open(path, "w").write(source.replace(anchor, anchor + declaration + "\n", 1))
          source = open(bridge).read()
          old = '    drm_client_register(&fb->client);       /* from here on hotplug reaches bridge_hotplug */'
          assert source.count(old) == 1
          source = source.replace(old, '    /* From here on hotplug reaches bridge_hotplug. */\n    drm_client_register(&fb->client);', 1)
          open(bridge, "w").write(source)
          ins_before(fb, "    int err = nmx_fb_open(dev, &info);", '    nmx_gpu_stage_record("fb.open.before", 0);')
          ins(fb, "    int err = nmx_fb_open(dev, &info);", '    nmx_gpu_stage_record("fb.open.after", err);')
          for call, label, result in [
              ('    err = -drm_client_init(drm, &fb->client, "nmxfb", &bridge_funcs);', 'fb.client', 'err'),
              ('    err = -drm_client_modeset_probe(&fb->client, 0, 0);', 'fb.probe', 'err'),
              ('    fb->buffer = drm_client_framebuffer_create(&fb->client, out->width, out->height, DRM_FORMAT_XRGB8888);', 'fb.buffer', 'IS_ERR(fb->buffer) ? (int)PTR_ERR(fb->buffer) : (fb->buffer != NULL ? 0 : -12)'),
              ('    err = -drm_client_buffer_vmap(fb->buffer, &fb->map);', 'fb.vmap', 'err'),
              ('    err = -drm_client_modeset_commit(&fb->client);', 'fb.commit', 'err'),
              ('    drm_client_register(&fb->client);', 'fb.register', '0'),
          ]:
              ins_before(bridge, call, '    nmx_gpu_stage_record("' + label + '.before", 0);')
              ins(bridge, call, '    nmx_gpu_stage_record("' + label + '.after", ' + result + ');', scope='int nmx_fb_open(')
          print("Live stage v2 enabled: no checkpoint firmware writes; bounded 90-second default delay")
          open('/tmp/nmx-instrumented', 'w').write('ok\n')
          print('instrumentation complete')
          PY
          test -f /tmp/nmx-instrumented || { echo "::error::instrumentation did not apply"; exit 1; }
          python3 gen_flags.py "$S/kpi/drm-kmod" amd.flags | tee /tmp/genflags.log
          if grep -Eq '^-DCONFIG_DRM_(DISPLAY_DP_TUNNEL|I915_DP_TUNNEL)(=|$)' amd.flags; then
            echo "::error::DP tunnel frontend/core flags must both be disabled in this port"
            exit 1
          fi
          echo "DP tunnel configuration verified: frontend=off core=off"
          echo "== DRM / TTM / amdgpu =="
          bash all.sh 30 | tee /tmp/all.log || true
          echo "== i915 =="
          bash all-i915.sh 30 | tee /tmp/i915.log || true
          echo "== LinuxKPI runtime + bsdcompat + IOKit glue =="
          bash rt.sh | tee /tmp/rt.log || true
          echo "== link (xe left out: UHD 770 is i915 only) =="
          python3 - <<'PY'
          p = 'kext/build.sh'
          s = open(p).read()
          s = s.replace('xcrun ld -r -arch x86_64 obj-xe/*.o -exported_symbols_list xe.exp -o xe_all.o', 'true  # xe sources are not built in this job')
          s = s.replace('obj-i915/*.o xe_all.o lkobj', 'obj-i915/*.o lkobj')
          s = s.replace('-lkmodc++ -lkmod -lcc_kext', '-L"$(xcrun --sdk macosx --show-sdk-path)/usr/lib" -lkmodc++ -lkmod -lcc_kext')
          open(p, 'w').write(s)
          print('patched kext/build.sh')
          PY
          grep -n 'obj-i915\|xcrun --sdk' kext/build.sh
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          bash kext/build.sh "$GITHUB_WORKSPACE/out" 2>&1 | tee /tmp/link.log || true
          echo "== summary =="
          grep -E 'sources:|runtime sources:' /tmp/all.log /tmp/i915.log /tmp/rt.log || true
          tail -30 /tmp/link.log || true

      - name: Collect logs and the kext
        if: always()
        run: |
          set -uo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          cp /tmp/all.log /tmp/i915.log /tmp/rt.log /tmp/link.log /tmp/genflags.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp "$X/amd.flags" "$GITHUB_WORKSPACE/out/logs/amd.flags" 2>/dev/null || true
          for d in logs logs-i915 lklogs; do
            [ -d "$X/$d" ] && cp -R "$X/$d" "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          done
          cp "$X"/xlog_nmx_kext.txt "$X"/link.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/out/logs/diagnostic-source"
          cp "$X/xnu/nmx_kext.cpp" "$X/xnu/nmx_fb.cpp" "$X/override/src/nmx_fb_bridge.c" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out" || true

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmxgpu-build
          path: out
          if-no-files-found: warn

      - name: Publish the log back into this repo
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          mkdir -p ci
          {
            echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "commit $GITHUB_SHA"
            echo "freebsd-src $(git -C "$S/kpi/freebsd-src" rev-parse HEAD 2>/dev/null || echo unknown)"
            echo
            for f in /tmp/genflags.log /tmp/all.log /tmp/i915.log /tmp/rt.log /tmp/link.log; do
              [ -f "$f" ] && { echo "===== $f"; tail -100 "$f"; echo; }
            done
            echo "===== first failing sources"
            for d in logs logs-i915 lklogs; do
              [ -d "$X/$d" ] || continue
              grep -l 'error:' "$X/$d"/*.log 2>/dev/null | head -12 | while read -r l; do
                echo "--- $l"
                grep -m20 'error:' "$l" 2>/dev/null
              done
            done
            echo "===== kext"
            ls -l "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" 2>/dev/null || echo "no NMXGPU binary"
          } > ci/last-run.txt
          # The same text on the run page, so the numbers survive a failed push.
          { echo '```'; cat ci/last-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci/last-run.txt
          if git diff --cached --quiet; then
            echo "no log change"
            exit 0
          fi
          git commit -m "ci: build log $GITHUB_RUN_ID"
          for i in 1 2 3; do
            if out=$(git push origin HEAD:main 2>&1); then
              echo "pushed the log"
              exit 0
            fi
            echo "::warning title=log push $i failed::$out"
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            sleep 5
          done
          echo "::warning title=log not published::the build log stays in ci/last-run.txt on the runner and in the nmxgpu-build artifact"

      # Every build step above is deliberately tolerant so that all the logs get collected.
      # Without this gate a dropped translation unit disappears silently: the sources that
      # fail are the only ones that reference ACPI, so the kext still links with no ACPI at
      # all. This step turns that into a red run.
      - name: Fail if any source was dropped
        if: always()
        run: |
          set -uo pipefail
          total=0
          detail=""
          for f in /tmp/all.log /tmp/i915.log /tmp/rt.log; do
            n=$(sed -n 's/.*failed: *\([0-9][0-9]*\).*/\1/p' "$f" 2>/dev/null | head -1)
            if [ -z "${n:-}" ]; then
              echo "::error::$f is missing or has no summary line"
              exit 1
            fi
            echo "$(basename "$f"): $n failed"
            detail="$detail $(basename "$f" .log)=$n"
            total=$((total + n))
          done
          ksize=$(stat -f %z "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" 2>/dev/null || echo 0)
          sha=$(git -C /Volumes/MiniData/build/gpu-src/kpi/freebsd-src rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "::notice title=NMXGPU build result::failed=$total$detail freebsd-src=$sha kext=${ksize}B"
          echo "total failed sources: $total"
          if [ "$total" -ne 0 ]; then
            echo "::error::$total source(s) failed to compile; see ci/last-run.txt and the nmxgpu-build artifact"
            exit 1
          fi
          test -x "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" \
            || { echo "::error::NMXGPU was not linked; see ci/last-run.txt"; exit 1; }
          test -f /tmp/nmx-instrumented \
            || { echo "::error::diagnostic instrumentation did not complete"; exit 1; }
          BIN="$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU"
          xcrun nm -arch x86_64 "$BIN" > /tmp/nmxgpu-symbols.txt \
            || { echo "::error::cannot read NMXGPU symbols"; exit 1; }
          for sym in _i915_pci_driver _i915_driver_probe _adl_s_info _nmx_port_attach _nmx_gpu_stage_record; do
            grep -Eq "[[:space:]]$sym$" /tmp/nmxgpu-symbols.txt \
              || { echo "::error::missing symbol $sym"; exit 1; }
          done
          strings -a "$BIN" > /tmp/nmxgpu-strings.txt \
            || { echo "::error::cannot read NMXGPU diagnostic strings"; exit 1; }
          for marker in 'stage display_noirq' 'stage irq_install' 'stage gem_init' 'stage display_probe' 'optional opregion_setup' 'ASLS_present=' 'tunnel_config i915=' 'nogem tunnel_mgr_init' 'memstage-v2' 'framebuffer.before' 'gem_init.before' 'pm.callback.before' 'fb.commit.before' 'attach.complete'; do
            grep -Fq "$marker" /tmp/nmxgpu-strings.txt \
              || { echo "::error::missing diagnostic marker $marker"; exit 1; }
          done
          echo "NMXGPU diagnostic symbols and stage markers verified"

