name: build NMXGPU (UHD 770 audited display batch)
on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore all caches for a clean diagnostic build
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'experimental/uhd770/sources.json'
      - 'experimental/uhd770/patches/**'
      - 'experimental/uhd770/tools/**'
      - 'experimental/uhd770/tests/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      NMX_USE_CACHE: ${{ github.event_name != 'workflow_dispatch' || !inputs.clean_build }}
      CCACHE_NODIRECT: 'true'
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out this fork (full history, for the GPU source at 7222618)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostics
        run: |
          set -uo pipefail
          echo "== system =="
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --show-sdk-path
          python3 -V || true
          echo "== kernel link libraries =="
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          ls "$SDK/usr/lib" 2>/dev/null | grep -Ei 'kmod|cc_kext' || echo "not in SDK/usr/lib"
          find "$(xcode-select -p)" -name 'libkmod.a' -o -name 'libcc_kext.a' 2>/dev/null | head -10 || true
          echo "== Kernel.framework headers =="
          ls "$SDK/System/Library/Frameworks/Kernel.framework/Headers" 2>/dev/null | head -5 || true

      - name: Prepare compiler cache and toolchain identity
        id: toolchain
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache
          fi
          {
            sw_vers -productVersion
            xcodebuild -version
            xcrun clang --version
            xcrun --sdk macosx --show-sdk-version
            ccache --version
          } > /tmp/nmx-toolchain.txt
          echo "fingerprint=$(shasum -a 256 /tmp/nmx-toolchain.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$HOME/.cache/nmxgpu/ccache" >> "$GITHUB_ENV"
          echo "NMX_DEPENDENCY_CACHE=$HOME/.cache/nmxgpu/dependencies" >> "$GITHUB_ENV"
          if [[ "$NMX_USE_CACHE" != true ]]; then
            echo 'CCACHE_DISABLE=true' >> "$GITHUB_ENV"
          fi

      - name: Restore pristine pinned dependencies
        id: dependencies
        if: env.NMX_USE_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nmxgpu/dependencies
          key: nmxgpu-deps-v1-${{ runner.os }}-${{ hashFiles('experimental/uhd770/sources.json') }}

      - name: Restore compiler cache
        id: objects
        if: env.NMX_USE_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nmxgpu/ccache
          key: nmxgpu-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nmxgpu-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Stage the sources
        run: bash experimental/uhd770/tools/stage_sources.sh

      - name: Save pristine pinned dependencies
        if: env.NMX_USE_CACHE == 'true' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nmxgpu/dependencies
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Validate compiler cache invalidation
        run: |
          set -euo pipefail
          bash experimental/uhd770/tools/check_ccache.sh | tee /tmp/nmx-ccache-validation.log
          ccache --set-config=max_size=512M
          ccache --set-config=sloppiness=
          ccache --set-config=direct_mode=false
          ccache --set-config=depend_mode=false
          ccache --zero-stats

      - name: Build the kernel extension
        run: |
          set -euo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          cd "$X"
          mkdir -p obj obj-i915 obj-xe lkobj srcobj xnuobj lklogs logs logs-i915
          chmod +x ./*.sh
          sed -i '' 's|-I[$]KF|-I$K/freebsd-src/sys -I$KF|' cc.sh cc-i915.sh cclk.sh ccsrc.sh
          echo "== include patch check (want 1 per file) =="
          grep -c 'freebsd-src/sys' cc.sh cc-i915.sh cclk.sh ccsrc.sh || true
          git -C "$X" apply --check "$GITHUB_WORKSPACE/experimental/uhd770/patches/xkpi.patch"
          git -C "$S/kpi/drm-kmod" apply --check "$GITHUB_WORKSPACE/experimental/uhd770/patches/drm-kmod.patch"
          git -C "$X" apply "$GITHUB_WORKSPACE/experimental/uhd770/patches/xkpi.patch"
          git -C "$S/kpi/drm-kmod" apply "$GITHUB_WORKSPACE/experimental/uhd770/patches/drm-kmod.patch"
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/enable_ccache.py" "$X"
          python3 "$GITHUB_WORKSPACE/experimental/uhd770/tools/prepare_pci_fixture.py" \
            "$X/xnu/nmx_pci.cpp" \
            "$GITHUB_WORKSPACE/experimental/uhd770/tests/pci_class_fixture.cpp.in" \
            /tmp/nmx-pci-class-test.cpp
          touch /tmp/nmx-instrumented
          test -f /tmp/nmx-instrumented || { echo "::error::instrumentation did not apply"; exit 1; }
          c++ -std=c++17 -Wall -Wextra -Werror /tmp/nmx-pci-class-test.cpp -o /tmp/nmx-pci-class-test
          /tmp/nmx-pci-class-test | tee /tmp/nmx-pci-class-test.log
          touch /tmp/nmx-pci-class-test-ok
          python3 gen_flags.py "$S/kpi/drm-kmod" amd.flags | tee /tmp/genflags.log
          if grep -Eq '^-DCONFIG_DRM_(DISPLAY_DP_TUNNEL|I915_DP_TUNNEL)(=|$)' amd.flags; then
            echo "::error::DP tunnel frontend/core flags must both be disabled in this port"
            exit 1
          fi
          echo "DP tunnel configuration verified: frontend=off core=off"
          echo "== DRM / TTM / amdgpu =="
          bash all.sh 30 | tee /tmp/all.log || true
          echo "== i915 =="
          bash all-i915.sh 30 | tee /tmp/i915.log || true
          echo "== LinuxKPI runtime + bsdcompat + IOKit glue =="
          bash rt.sh | tee /tmp/rt.log || true
          echo "== link (xe left out: UHD 770 is i915 only) =="
          python3 - <<'PY'
          p = 'kext/build.sh'
          s = open(p).read()
          s = s.replace('xcrun ld -r -arch x86_64 obj-xe/*.o -exported_symbols_list xe.exp -o xe_all.o', 'true  # xe sources are not built in this job')
          s = s.replace('obj-i915/*.o xe_all.o lkobj', 'obj-i915/*.o lkobj')
          s = s.replace('-lkmodc++ -lkmod -lcc_kext', '-L"$(xcrun --sdk macosx --show-sdk-path)/usr/lib" -lkmodc++ -lkmod -lcc_kext')
          open(p, 'w').write(s)
          print('patched kext/build.sh')
          PY
          grep -n 'obj-i915\|xcrun --sdk' kext/build.sh
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          bash kext/build.sh "$GITHUB_WORKSPACE/out" 2>&1 | tee /tmp/link.log || true
          echo "== summary =="
          grep -E 'sources:|runtime sources:' /tmp/all.log /tmp/i915.log /tmp/rt.log || true
          tail -30 /tmp/link.log || true

      - name: Record compiler cache statistics
        if: always() && steps.toolchain.outcome == 'success'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          ccache --show-stats | tee "$GITHUB_WORKSPACE/out/logs/ccache-statistics.txt"
          ccache --print-stats > "$GITHUB_WORKSPACE/out/logs/ccache-statistics.tsv"
          ccache --show-config > "$GITHUB_WORKSPACE/out/logs/ccache-config.txt"
          cat "$GITHUB_WORKSPACE/out/logs/ccache-statistics.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs and the kext
        if: always()
        run: |
          set -uo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          cp /tmp/all.log /tmp/i915.log /tmp/rt.log /tmp/link.log /tmp/genflags.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp "$X/amd.flags" "$GITHUB_WORKSPACE/out/logs/amd.flags" 2>/dev/null || true
          for d in logs logs-i915 lklogs; do
            [ -d "$X/$d" ] && cp -R "$X/$d" "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          done
          cp "$X"/xlog_nmx_kext.txt "$X"/link.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/out/logs/diagnostic-source"
          cp "$X/xnu/nmx_kext.cpp" "$X/xnu/nmx_fb.cpp" "$X/override/src/nmx_fb_bridge.c" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/xnu/nmx_pci.cpp" "$X/bsdcompat/src/nmx_bus.c" "$X/bsdcompat/include/nmx_xnu.h" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_ddi.c" "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_hotplug_irq.c" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp /tmp/nmx-pci-class-test.cpp /tmp/nmx-pci-class-test.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp /tmp/nmx-ccache-validation.log /tmp/nmx-toolchain.txt "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true
          cp "$X/cc.sh" "$X/cc-i915.sh" "$X/cclk.sh" "$X/ccsrc.sh" "$X/ccxx.sh" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$X/override/i915/nmx_i915_scanout.c" "$X/bsdcompat/include/nmx_port.h" "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_fb_pin.c" "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_fb_pin.h" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          cp "$S/kpi/drm-kmod/drivers/gpu/drm/i915/display/intel_display_driver.c" "$GITHUB_WORKSPACE/experimental/uhd770/sources.json" "$GITHUB_WORKSPACE/out/logs/diagnostic-source/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out" || true

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmxgpu-build
          path: out
          if-no-files-found: warn

      - name: Publish the log back into this repo
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          S=/Volumes/MiniData/build/gpu-src
          X=$S/xkpi
          mkdir -p ci
          {
            echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "commit $GITHUB_SHA"
            echo "freebsd-src $(git -C "$S/kpi/freebsd-src" rev-parse HEAD 2>/dev/null || echo unknown)"
            echo
            for f in /tmp/genflags.log /tmp/all.log /tmp/i915.log /tmp/rt.log /tmp/link.log; do
              [ -f "$f" ] && { echo "===== $f"; tail -100 "$f"; echo; }
            done
            echo "===== first failing sources"
            for d in logs logs-i915 lklogs; do
              [ -d "$X/$d" ] || continue
              grep -l 'error:' "$X/$d"/*.log 2>/dev/null | head -12 | while read -r l; do
                echo "--- $l"
                grep -m20 'error:' "$l" 2>/dev/null
              done
            done
            echo "===== kext"
            ls -l "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" 2>/dev/null || echo "no NMXGPU binary"
          } > ci/last-run.txt
          # The same text on the run page, so the numbers survive a failed push.
          { echo '```'; cat ci/last-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci/last-run.txt
          if git diff --cached --quiet; then
            echo "no log change"
            exit 0
          fi
          git commit -m "ci: build log $GITHUB_RUN_ID"
          for i in 1 2 3; do
            if out=$(git push origin HEAD:main 2>&1); then
              echo "pushed the log"
              exit 0
            fi
            echo "::warning title=log push $i failed::$out"
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            sleep 5
          done
          echo "::warning title=log not published::the build log stays in ci/last-run.txt on the runner and in the nmxgpu-build artifact"

      # Every build step above is deliberately tolerant so that all the logs get collected.
      # Without this gate a dropped translation unit disappears silently: the sources that
      # fail are the only ones that reference ACPI, so the kext still links with no ACPI at
      # all. This step turns that into a red run.
      - name: Fail if any source was dropped
        if: always()
        run: |
          set -uo pipefail
          total=0
          detail=""
          for f in /tmp/all.log /tmp/i915.log /tmp/rt.log; do
            n=$(sed -n 's/.*failed: *\([0-9][0-9]*\).*/\1/p' "$f" 2>/dev/null | head -1)
            if [ -z "${n:-}" ]; then
              echo "::error::$f is missing or has no summary line"
              exit 1
            fi
            echo "$(basename "$f"): $n failed"
            detail="$detail $(basename "$f" .log)=$n"
            total=$((total + n))
          done
          ksize=$(stat -f %z "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" 2>/dev/null || echo 0)
          sha=$(git -C /Volumes/MiniData/build/gpu-src/kpi/freebsd-src rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "::notice title=NMXGPU build result::failed=$total$detail freebsd-src=$sha kext=${ksize}B"
          echo "total failed sources: $total"
          if [ "$total" -ne 0 ]; then
            echo "::error::$total source(s) failed to compile; see ci/last-run.txt and the nmxgpu-build artifact"
            exit 1
          fi
          test -x "$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU" \
            || { echo "::error::NMXGPU was not linked; see ci/last-run.txt"; exit 1; }
          test -f /tmp/nmx-instrumented \
            || { echo "::error::diagnostic instrumentation did not complete"; exit 1; }
          BIN="$GITHUB_WORKSPACE/out/NMXGPU.kext/Contents/MacOS/NMXGPU"
          xcrun nm -arch x86_64 "$BIN" > /tmp/nmxgpu-symbols.txt \
            || { echo "::error::cannot read NMXGPU symbols"; exit 1; }
          for sym in _i915_pci_driver _i915_driver_probe _adl_s_info _nmx_port_attach _nmx_gpu_stage_record _nmx_xnu_pci_find_class _nmx_i915_scanout_map _nmx_i915_scanout_unmap _nmx_intel_fb_pin_mappable; do
            grep -Eq "[[:space:]]$sym$" /tmp/nmxgpu-symbols.txt \
              || { echo "::error::missing symbol $sym"; exit 1; }
          done
          strings -a "$BIN" > /tmp/nmxgpu-strings.txt \
            || { echo "::error::cannot read NMXGPU diagnostic strings"; exit 1; }
          for marker in 'stage display_noirq' 'stage irq_install' 'stage gem_init' 'stage display_probe' 'optional opregion_setup' 'ASLS_present=' 'tunnel_config i915=' 'nogem tunnel_mgr_init' 'memstage-v2' 'framebuffer.before' 'gem_init.before' 'pm.callback.before' 'fb.commit.before' 'attach.complete' 'NullMoth PCI enum v1' 'pch_detect type=' 'hpd_tables pch=' 'pch_hpd missing' 'igtt.pin.before' 'igtt.iomap.after' 'boot guard retained for recovery' 'ADL-S CPU scanout, FBC disabled' 'failed: port attach; guard retained'; do
            grep -Fq "$marker" /tmp/nmxgpu-strings.txt \
              || { echo "::error::missing diagnostic marker $marker"; exit 1; }
          done
          test -f /tmp/nmx-pci-class-test-ok || { echo "::error::PCI class iterator fixture did not pass"; exit 1; }
          echo "NMXGPU diagnostic symbols and stage markers verified"

      - name: Save compiler cache after all build gates pass
        if: success() && env.NMX_USE_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nmxgpu/ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
