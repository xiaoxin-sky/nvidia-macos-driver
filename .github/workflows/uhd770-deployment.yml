name: UHD 770 deployment tools (no GPU execution)
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Targeted preparation regressions or the complete deployment flow
        default: all
        options: [all, prepare]
  push:
    paths:
      - '.github/workflows/uhd770-deployment.yml'
      - 'experimental/uhd770/acceleration/deployment/**'
      - 'experimental/uhd770/acceleration/kit/**'
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python preparation and archive boundary fixtures
        env:
          # Deliberate narrow regression selection for prepare/bootstrap-only
          # fixes; ordinary pushes and dispatches retain the complete suite.
          UHD770_TEST_SCOPE: ${{ inputs.scope || (contains(github.event.head_commit.message, '[prepare-only]') && 'prepare' || 'all') }}
        run: |
          python3 -m unittest discover -s experimental/uhd770/acceleration/kit -p 'test_*.py' -v
          python3 - <<'PY'
          import os, sys, time, unittest
          def annotation(kind, title, text):
              message = str(text)[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{kind} title={title}::{message}', flush=True)
          class ObservedResult(unittest.TextTestResult):
              def startTest(self, test):
                  self.started = time.monotonic()
                  if test.id().startswith('test_session_flow.'):
                      annotation('notice', 'Flow fixture started', test.id())
                  super().startTest(test)
              def stopTest(self, test):
                  if test.id().startswith('test_session_flow.'):
                      annotation('notice', 'Flow fixture ended', f'{test.id()} seconds={time.monotonic()-self.started:.2f}')
                  super().stopTest(test)
              def addError(self, test, err):
                  super().addError(test, err)
                  annotation('error', 'Deployment fixture error', self.errors[-1][1])
              def addFailure(self, test, err):
                  super().addFailure(test, err)
                  annotation('error', 'Deployment fixture failure', self.failures[-1][1])
          if os.environ.get('UHD770_TEST_SCOPE') == 'prepare':
              sys.path.insert(0, 'experimental/uhd770/acceleration/deployment')
              suite = unittest.defaultTestLoader.loadTestsFromNames([
                  'test_prepare_kit', 'test_bootstrap', 'test_archive_failed',
                  'test_session_flow.SessionFlowTests.test_native_group_writable_var_run_is_not_a_preparation_lock_parent',
                  'test_session_flow.SessionFlowTests.test_export_preserves_early_root_bootstrap_without_prepared_plan',
              ])
          else:
              suite = unittest.defaultTestLoader.discover('experimental/uhd770/acceleration/deployment', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2, resultclass=ObservedResult).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Native system Bash syntax and inert command help
        run: |
          /bin/bash --version | head -1
          for script in experimental/uhd770/acceleration/deployment/*.sh experimental/uhd770/acceleration/deployment/capture/*.sh experimental/uhd770/acceleration/deployment/probes/*.sh; do
            /bin/bash -n "$script"
          done
          /bin/bash -p experimental/uhd770/acceleration/deployment/manage.sh --help
          /bin/bash -p experimental/uhd770/acceleration/deployment/preflight.sh --help
          /bin/bash -p experimental/uhd770/acceleration/deployment/session.sh --help
          /bin/bash -p experimental/uhd770/acceleration/deployment/Start-UHD770.command --help
          /bin/bash -p experimental/uhd770/acceleration/deployment/Run-UHD770-Test.command --help
          /bin/bash -n experimental/uhd770/acceleration/deployment/Archive-UHD770-Failed.command
          /bin/bash -p experimental/uhd770/acceleration/deployment/Archive-UHD770-Failed.command --help
      - name: Mock capture and probe supervision (never opens a GPU)
        run: |
          /bin/bash experimental/uhd770/acceleration/deployment/capture/test_capture.sh
          /bin/bash experimental/uhd770/acceleration/deployment/capture/test_capture_finish.sh
          /bin/bash experimental/uhd770/acceleration/deployment/probes/test-runner.sh
          /bin/bash experimental/uhd770/acceleration/deployment/test_session.sh
      - name: Check launchd template without registering it
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path('experimental/uhd770/acceleration/deployment/capture/com.uhd770.mvp.capture.plist')
          data = plistlib.loads(path.read_bytes())
          assert data['Label'] == 'com.uhd770.mvp.capture'
          assert data['RunAtLoad'] is True and data['KeepAlive'] is False
          assert data['ProgramArguments'] == ['/bin/bash', '/Library/Application Support/UHD770MVP/capture/collector.sh', '--duration', '300']
          assert data['StandardErrorPath'].startswith('/private/var/log/UHD770MVP/')
          print('Launchd template validated only; no registration, driver load or GPU execution.')
          root = Path('experimental/uhd770/acceleration/deployment')
          for kind in ['root']:
              job = plistlib.loads((root / f'com.uhd770.mvp.session-{kind}.plist').read_bytes())
              assert job['Label'] == 'com.uhd770.mvp.session'
              assert job['RunAtLoad'] is True and job['KeepAlive'] is False
              assert job['ProgramArguments'][:2] == ['/bin/bash', '-p']
          print('Only root recovery/capture template validated; compute requires an explicit manual command.')
          PY
  windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recovery against temporary fake USB inventory only
        run: python -m unittest discover -s experimental/uhd770/acceleration/deployment -p test_windows_recovery.py -v
